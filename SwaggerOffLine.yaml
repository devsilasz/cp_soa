openapi: 3.1.0
info:
  title: Auto Escola 3ESS
  description: API REST para sistema de gerenciamento de instruções da Auto Escola
    3ESS.
  contact:
    name: Auto Escola 3ESS
    email: autoescola3ess@email.com.br
  license:
    name: Apache 2.0
    url: http://springdoc.org
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /instrutores:
    get:
      tags:
      - instrutor-controller
      operationId: listar
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "nome,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemInstrutor"
      security:
      - bearer-key: []
    put:
      tags:
      - instrutor-controller
      operationId: atualizar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAtualizacaoInstrutor"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
    post:
      tags:
      - instrutor-controller
      operationId: cadastrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCadastroInstrutor"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
  /alunos:
    get:
      tags:
      - aluno-controller
      operationId: listar_1
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "nome,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemAluno"
      security:
      - bearer-key: []
    put:
      tags:
      - aluno-controller
      operationId: atualizar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAtualizacaoAluno"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
    post:
      tags:
      - aluno-controller
      operationId: cadastrar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCadastroAluno"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
  /login:
    post:
      tags:
      - login-controller
      operationId: efetuarLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosLogin"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosTokenJWT"
  /instrucoes:
    post:
      tags:
      - instrucao-controller
      operationId: agendarInstrucao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAgendamento"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAgendamento"
      security:
      - bearer-key: []
    delete:
      tags:
      - instrucao-controller
      operationId: cancelarInstrucao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCancelamento"
        required: true
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
  /instrutores/{id}:
    get:
      tags:
      - instrutor-controller
      operationId: detalhar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
    delete:
      tags:
      - instrutor-controller
      operationId: excluir
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
  /health-check:
    get:
      tags:
      - health-check-controller
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /enderecos/{cep}:
    get:
      tags:
      - endereco-controller
      operationId: buscarPorCep
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
      security:
      - bearer-key: []
  /alunos/{id}:
    get:
      tags:
      - aluno-controller
      operationId: detalhar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
    delete:
      tags:
      - aluno-controller
      operationId: excluir_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearer-key: []
components:
  schemas:
    DadosAtualizacaoInstrutor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - id
    DadosEndereco:
      type: object
      properties:
        logradouro:
          type: string
          minLength: 1
        numero:
          type: string
        complemento:
          type: string
        bairro:
          type: string
          minLength: 1
        cidade:
          type: string
          minLength: 1
        uf:
          type: string
          minLength: 1
          pattern: "[A-Z]{2}"
        cep:
          type: string
          minLength: 1
          pattern: "\\d{5}-\\d{3}"
      required:
      - bairro
      - cep
      - cidade
      - logradouro
      - uf
    DadosDetalhamentoInstrutor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string
        cnh:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
        ativo:
          type: boolean
    DadosAtualizacaoAluno:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - id
    DadosDetalhamentoAluno:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string
        cpf:
          type: string
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
        ativo:
          type: boolean
    DadosLogin:
      type: object
      properties:
        login:
          type: string
          minLength: 1
        senha:
          type: string
          minLength: 1
      required:
      - login
      - senha
    DadosTokenJWT:
      type: object
      properties:
        tokenJWT:
          type: string
    DadosCadastroInstrutor:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        telefone:
          type: string
          minLength: 1
        cnh:
          type: string
          minLength: 1
          pattern: "[0-9]{9,11}"
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - cnh
      - email
      - especialidade
      - nome
      - telefone
    DadosAgendamento:
      type: object
      properties:
        id_aluno:
          type: integer
          format: int64
        id_instrutor:
          type: integer
          format: int64
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        data_hora:
          type: string
          format: date-time
      required:
      - data_hora
      - id_aluno
    DadosDetalhamentoAgendamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome_aluno:
          type: string
        nome_instrutor:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        data_hora:
          type: string
          format: date-time
    DadosCadastroAluno:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        telefone:
          type: string
          minLength: 1
        cpf:
          type: string
          minLength: 1
          pattern: "\\d{11}"
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - cpf
      - email
      - endereco
      - nome
      - telefone
    DadosListagemInstrutor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
    PageDadosListagemInstrutor:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/DadosListagemInstrutor"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        unpaged:
          type: boolean
        offset:
          type: integer
          format: int64
    SortObject:
      type: object
      properties:
        unsorted:
          type: boolean
        sorted:
          type: boolean
        empty:
          type: boolean
    DadosListagemAluno:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        cpf:
          type: string
    PageDadosListagemAluno:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/DadosListagemAluno"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    DadosCancelamento:
      type: object
      properties:
        id_instrucao:
          type: integer
          format: int64
        motivo:
          type: string
          enum:
          - ALUNO_DESISTIU
          - INSTRUTOR_CANCELOU
          - OUTROS
      required:
      - id_instrucao
      - motivo
  securitySchemes:
    bearer-key:
      type: http
      scheme: bearer
      bearerFormat: JWT
